<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alien Hunt — Duck Hunt in Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    font-family: 'Orbitron', 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
    cursor: none;
  }
  canvas { display: block; }

  /* ── HUD ── */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: linear-gradient(180deg, rgba(0,0,0,.94) 0%, rgba(0,0,20,.72) 100%);
    border-bottom: 1px solid rgba(0,210,255,.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 10;
    backdrop-filter: blur(6px);
  }
  #hud-logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00d4ff;
    text-shadow: 0 0 14px #00d4ff88;
  }
  #hud-center { display: flex; align-items: center; gap: 32px; }
  .hud-stat { font-size: 12px; color: #64748b; letter-spacing: 1px; }
  .hud-stat span { color: #e2e8f0; font-weight: 700; font-size: 17px; }
  #hud-restart {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #475569;
    background: none;
    border: 1px solid #1e293b;
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  #hud-restart:hover { color: #94a3b8; border-color: #334155; }

  /* ── Fun Fact Banner ── */
  #fact-banner {
    position: fixed;
    bottom: -130px;
    left: 50%;
    transform: translateX(-50%);
    width: min(720px, 94vw);
    background: linear-gradient(135deg, rgba(0,8,28,.97), rgba(0,15,45,.97));
    border: 1px solid rgba(0,210,255,.35);
    border-radius: 16px;
    padding: 18px 24px;
    z-index: 20;
    transition: bottom .45s cubic-bezier(.23,1,.32,1);
    box-shadow: 0 0 40px rgba(0,210,255,.12), 0 8px 32px rgba(0,0,0,.7);
  }
  #fact-banner.show { bottom: 24px; }
  #fact-banner.boss-fact { border-color: rgba(239,68,68,.5); box-shadow: 0 0 40px rgba(239,68,68,.2), 0 8px 32px rgba(0,0,0,.7); }
  #fact-label {
    font-size: 10px;
    letter-spacing: 2.5px;
    color: #00d4ff;
    margin-bottom: 8px;
    text-transform: uppercase;
    font-weight: 700;
  }
  #fact-banner.boss-fact #fact-label { color: #f87171; }
  #fact-text {
    font-size: 15px;
    color: #e2e8f0;
    line-height: 1.65;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-weight: 400;
  }

  /* ── Overlay (start screen) ── */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    background: radial-gradient(ellipse at center, rgba(0,0,30,.93) 0%, rgba(0,0,0,.98) 100%);
  }
  #overlay.hidden { display: none; }
  .overlay-icon { font-size: 78px; animation: bob 1.4s ease-in-out infinite; margin-bottom: 18px; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
  .overlay-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    color: #00d4ff;
    text-shadow: 0 0 36px #00d4ffaa;
    letter-spacing: 5px;
    margin-bottom: 12px;
    text-align: center;
  }
  .overlay-sub {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 44px;
    text-align: center;
    max-width: 460px;
    line-height: 1.75;
    font-family: system-ui, sans-serif;
    font-weight: 400;
  }
  .btn {
    padding: 15px 52px;
    background: linear-gradient(135deg, #0ea5e9, #7c3aed);
    border: none;
    border-radius: 40px;
    font-family: 'Orbitron', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 0 34px rgba(14,165,233,.4);
  }
  .btn:hover { transform: scale(1.07); box-shadow: 0 0 55px rgba(14,165,233,.65); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div id="hud-logo">👾 ALIEN HUNT</div>
  <div id="hud-center">
    <div class="hud-stat">LEVEL <span id="hud-level">1</span></div>
    <div class="hud-stat">SCORE <span id="hud-score">0</span></div>
    <div class="hud-stat">KILLS <span id="hud-kills">0</span></div>
  </div>
  <button id="hud-restart" onclick="startGame()" style="display:none">↺ RESTART</button>
</div>

<!-- Fun Fact Banner (persists until next kill) -->
<div id="fact-banner">
  <div id="fact-label">FUN FACT</div>
  <div id="fact-text"></div>
</div>

<!-- Canvas -->
<canvas id="c"></canvas>

<!-- Start screen -->
<div id="overlay">
  <div class="overlay-icon">👾</div>
  <div class="overlay-title">ALIEN HUNT</div>
  <div class="overlay-sub">
    Shoot the aliens before they escape!<br>
    Every kill reveals a cosmic fun fact.<br>
    Every 10 kills summons a <span style="color:#f87171;font-weight:700">BOSS</span> — it takes multiple shots to kill.
  </div>
  <button class="btn" onclick="startGame()">LAUNCH GAME</button>
</div>

<script>
'use strict';

// ── Canvas ──────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', () => { resize(); if (!G.running) bgFrame(); });

// ── Fun Facts (10 total — no auto-dismiss) ───────────────────────────────────
const FACTS = [
  'The "Wow! Signal" detected in 1977 lasted exactly 72 seconds — and has never been heard again.',
  'There are ~40 billion Earth-sized planets in the Milky Way\'s habitable zones alone.',
  'Europa, one of Jupiter\'s moons, holds more liquid water than all of Earth\'s oceans combined.',
  'Scientists have found amino acids — the building blocks of life — inside meteorites from space.',
  'The Fermi Paradox asks: if billions of habitable planets exist, why haven\'t we heard from anyone yet?',
  'Enceladus, a moon of Saturn, shoots water geysers 500 km into space from a warm subsurface ocean.',
  'In 2021, the US government officially confirmed military pilots recorded real, unexplained UAP footage.',
  'TRAPPIST-1 has 7 Earth-sized planets — 3 in the habitable zone — just 39 light-years from Earth.',
  'Tardigrades can survive open space, extreme radiation, and the vacuum of a vacuum. True space aliens.',
  'The observable universe contains more stars than there are grains of sand on all of Earth\'s beaches.',
];
let factIndex = 0;

// ── Color palettes ────────────────────────────────────────────────────────────
const PALETTES = [
  ['#86efac','#4ade80','#166534'], // Zorgon   – green
  ['#fdba74','#f97316','#7c2d12'], // Blorbax  – orange
  ['#93c5fd','#60a5fa','#1e3a5f'], // MechX-9  – blue
  ['#c4b5fd','#a78bfa','#4c1d95'], // Wiggloid – purple
  ['#fca5a5','#ef4444','#450a0a'], // Boss     – crimson
];

// ── roundRect helper ──────────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// ── Alien draw functions ───────────────────────────────────────────────────────
function drawZorgon(ctx, x, y, s, flash) {
  const c = flash ? '#fff' : PALETTES[0][0];
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(x, y+4*s, 16*s, 20*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, y-12*s, 14*s, 16*s, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.ellipse(x-6*s, y-13*s, 4.5*s, 6*s, -.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+6*s, y-13*s, 4.5*s, 6*s,  .3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#7dd3fc';
  ctx.beginPath(); ctx.arc(x-6*s, y-13*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6*s, y-13*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = PALETTES[0][1]; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.moveTo(x-7*s, y-26*s); ctx.lineTo(x-4*s, y-19*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+7*s, y-26*s); ctx.lineTo(x+4*s, y-19*s); ctx.stroke();
  ctx.fillStyle = '#fef08a';
  ctx.beginPath(); ctx.arc(x-7*s, y-27*s, 2.5*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+7*s, y-27*s, 2.5*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.2*s;
  ctx.beginPath(); ctx.arc(x, y-8*s, 5*s, 0.1, Math.PI-.1); ctx.stroke();
  ctx.strokeStyle = c; ctx.lineWidth = 3*s;
  ctx.beginPath(); ctx.moveTo(x-16*s, y+4*s); ctx.lineTo(x-24*s, y-2*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+16*s, y+4*s); ctx.lineTo(x+24*s, y-2*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-8*s, y+22*s); ctx.lineTo(x-12*s, y+30*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8*s, y+22*s); ctx.lineTo(x+12*s, y+30*s); ctx.stroke();
}

function drawBlorbax(ctx, x, y, s, flash) {
  const c = flash ? '#fff' : PALETTES[1][0];
  ctx.strokeStyle = flash ? '#fff' : PALETTES[1][1]; ctx.lineWidth = 3*s;
  const angles = [-60,-36,-12,12,36,60];
  angles.forEach((a, i) => {
    const rad = a * Math.PI/180;
    const wt = (Date.now()*.003 + i) % (Math.PI*2);
    ctx.beginPath();
    ctx.moveTo(x + Math.sin(rad)*10*s, y+12*s);
    ctx.quadraticCurveTo(x + Math.sin(rad)*18*s, y+16*s,
      x + Math.sin(rad)*22*s + Math.sin(wt)*4*s,
      y + Math.abs(Math.cos(rad))*10*s + 22*s);
    ctx.stroke();
  });
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x, y, 18*s, 0, Math.PI*2); ctx.fill();
  [-10,-3,4].forEach(ox => {
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(x+ox*s, y-2*s, 4.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#f0abfc';
    ctx.beginPath(); ctx.arc(x+ox*s, y-2*s, 1.8*s, 0, Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.arc(x, y+6*s, 7*s, .1, Math.PI-.1); ctx.stroke();
}

function drawMechX(ctx, x, y, s, flash) {
  const c = flash ? '#fff' : '#334155';
  const acc = flash ? '#fff' : PALETTES[2][0];
  ctx.fillStyle = '#1e293b';
  roundRect(ctx, x-10*s, y+18*s, 8*s, 14*s, 2*s); ctx.fill();
  roundRect(ctx, x+2*s,  y+18*s, 8*s, 14*s, 2*s); ctx.fill();
  ctx.fillStyle = c;
  roundRect(ctx, x-18*s, y, 36*s, 28*s, 4*s); ctx.fill();
  ctx.strokeStyle = acc; ctx.lineWidth = 1*s;
  roundRect(ctx, x-18*s, y, 36*s, 28*s, 4*s); ctx.stroke();
  ctx.fillStyle = Math.sin(Date.now()*.006) > 0 ? '#f87171' : '#450a0a';
  ctx.beginPath(); ctx.arc(x, y+16*s, 4*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c;
  roundRect(ctx, x-14*s, y-26*s, 28*s, 26*s, 3*s); ctx.fill();
  ctx.strokeStyle = acc; ctx.lineWidth = 1*s;
  roundRect(ctx, x-14*s, y-26*s, 28*s, 26*s, 3*s); ctx.stroke();
  ctx.fillStyle = acc;
  roundRect(ctx, x-11*s, y-22*s, 9*s, 9*s, 1.5*s); ctx.fill();
  roundRect(ctx, x+2*s,  y-22*s, 9*s, 9*s, 1.5*s); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(x-6.5*s, y-17.5*s, 2*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+6.5*s, y-17.5*s, 2*s, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = acc; ctx.lineWidth = 1.5*s;
  ctx.beginPath(); ctx.moveTo(x, y-26*s); ctx.lineTo(x, y-34*s); ctx.stroke();
  ctx.fillStyle = acc; ctx.beginPath(); ctx.arc(x, y-35*s, 2.5*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1e293b';
  roundRect(ctx, x-26*s, y+2*s, 8*s, 18*s, 3*s); ctx.fill();
  roundRect(ctx, x+18*s, y+2*s, 8*s, 18*s, 3*s); ctx.fill();
}

function drawWiggloid(ctx, x, y, s, flash) {
  const c = flash ? '#fff' : PALETTES[3][0];
  ctx.strokeStyle = flash ? '#fff' : PALETTES[3][1]; ctx.lineWidth = 2.5*s;
  ctx.beginPath(); ctx.moveTo(x-8*s, y-14*s); ctx.lineTo(x-10*s, y-26*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+8*s, y-14*s); ctx.lineTo(x+10*s, y-26*s); ctx.stroke();
  ctx.fillStyle = '#fef9c3';
  ctx.beginPath(); ctx.arc(x-10*s, y-27*s, 4.5*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+10*s, y-27*s, 4.5*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(x-10*s, y-27*s, 2*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+10*s, y-27*s, 2*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x, y, 18*s, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(x, y+6*s, 6*s, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fca5a5';
  ctx.beginPath(); ctx.arc(x, y+6*s, 4*s, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 3*s;
  ctx.beginPath(); ctx.moveTo(x-18*s, y); ctx.lineTo(x-26*s, y-6*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+18*s, y); ctx.lineTo(x+26*s, y-6*s); ctx.stroke();
  ctx.fillStyle = c;
  ctx.beginPath(); ctx.arc(x-26*s, y-6*s, 4*s, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+26*s, y-6*s, 4*s, 0, Math.PI*2); ctx.fill();
}

// ── Boss draw ─────────────────────────────────────────────────────────────────
function drawBossBody(ctx, x, y, s, flash) {
  const bc  = flash ? '#fff' : '#7f1d1d';
  const ac  = flash ? '#fff' : '#ef4444';
  const dk  = flash ? '#fff' : '#991b1b';

  // Crown spikes
  [-50,-30,-10,10,30,50].forEach((ox, i) => {
    ctx.fillStyle = flash ? '#fff' : (i%2===0 ? '#dc2626' : '#b91c1c');
    ctx.beginPath();
    ctx.moveTo(x+ox*s,    y-38*s);
    ctx.lineTo(x+(ox-8)*s, y-20*s);
    ctx.lineTo(x+(ox+8)*s, y-20*s);
    ctx.closePath(); ctx.fill();
  });

  // Body
  ctx.fillStyle = bc;
  ctx.beginPath(); ctx.ellipse(x, y+8*s, 38*s, 44*s, 0, 0, Math.PI*2); ctx.fill();
  // Head
  ctx.beginPath(); ctx.ellipse(x, y-20*s, 32*s, 28*s, 0, 0, Math.PI*2); ctx.fill();

  // Vertical body ridges
  if (!flash) {
    ctx.strokeStyle = dk; ctx.lineWidth = 2*s;
    [-14,0,14].forEach(ox => {
      ctx.beginPath(); ctx.moveTo(x+ox*s, y); ctx.lineTo(x+ox*s, y+24*s); ctx.stroke();
    });
  }

  // 5 glowing eyes
  [-22,-11,0,11,22].forEach(ox => {
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.ellipse(x+ox*s, y-22*s, 5*s, 6*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = flash ? '#fff' : ac;
    ctx.shadowColor = ac; ctx.shadowBlur = flash ? 0 : 14;
    ctx.beginPath(); ctx.arc(x+ox*s, y-22*s, 2.5*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Snarl mouth
  ctx.strokeStyle = flash ? '#fff' : '#fca5a5'; ctx.lineWidth = 2.5*s;
  ctx.beginPath();
  ctx.moveTo(x-18*s, y-8*s);
  ctx.lineTo(x-8*s, y-4*s); ctx.lineTo(x, y-8*s);
  ctx.lineTo(x+8*s, y-4*s); ctx.lineTo(x+18*s, y-8*s);
  ctx.stroke();

  // 4 arms
  ctx.strokeStyle = bc; ctx.lineWidth = 6*s;
  ctx.beginPath(); ctx.moveTo(x-38*s, y-2*s); ctx.lineTo(x-56*s, y-16*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-38*s, y+10*s); ctx.lineTo(x-60*s, y+20*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+38*s, y-2*s); ctx.lineTo(x+56*s, y-16*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+38*s, y+10*s); ctx.lineTo(x+60*s, y+20*s); ctx.stroke();

  // Claws
  [[x-56*s, y-16*s, -1],[x-60*s, y+20*s, -1],
   [x+56*s, y-16*s,  1],[x+60*s, y+20*s,  1]].forEach(([cx, cy, d]) => {
    ctx.strokeStyle = flash ? '#fff' : ac; ctx.lineWidth = 2.5*s;
    [-1,0,1].forEach(i => {
      ctx.beginPath();
      ctx.moveTo(cx, cy); ctx.lineTo(cx+d*10*s, cy+i*8*s-4*s); ctx.stroke();
    });
  });

  // Legs
  ctx.strokeStyle = bc; ctx.lineWidth = 5*s;
  ctx.beginPath(); ctx.moveTo(x-18*s, y+48*s); ctx.lineTo(x-24*s, y+64*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+18*s, y+48*s); ctx.lineTo(x+24*s, y+64*s); ctx.stroke();
}

// ── Alien definitions ─────────────────────────────────────────────────────────
const ALIEN_TYPES = [
  { name: 'Zorgon',   points: 100, draw: drawZorgon,  w: 48, h: 56 },
  { name: 'Blorbax',  points: 150, draw: drawBlorbax, w: 52, h: 60 },
  { name: 'MechX-9',  points: 200, draw: drawMechX,   w: 46, h: 58 },
  { name: 'Wiggloid', points: 120, draw: drawWiggloid, w: 44, h: 52 },
];

// ── Particle ──────────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, palIdx, scale=1) {
    const pal = PALETTES[palIdx];
    this.x = x; this.y = y;
    this.vx = (Math.random()-.5)*8*scale;
    this.vy = (Math.random()-.85)*8*scale;
    this.r  = (Math.random()*5+2)*scale;
    this.col = pal[Math.random()*pal.length|0];
    this.life = 1;
    this.decay = Math.random()*.035+.02;
    this.gravity = .14;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += this.gravity; this.vx *= .97;
    this.life -= this.decay; this.r *= .97;
  }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.col;
    ctx.shadowColor = this.col; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

// ── Score popup ───────────────────────────────────────────────────────────────
class ScorePopup {
  constructor(x, y, text, col='#fbbf24', big=false) {
    this.x=x; this.y=y; this.text=text; this.col=col; this.big=big;
    this.life=1; this.vy=-1.6;
  }
  update() { this.y+=this.vy; this.life-=.022; }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.col;
    const sz = this.big ? 30 : 22;
    ctx.font = `bold ${Math.round(sz*(1+(1-this.life)*.25))}px Orbitron, monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = this.col; ctx.shadowBlur = this.big ? 20 : 10;
    ctx.fillText(this.text, this.x, this.y);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

// ── Click ring effect ─────────────────────────────────────────────────────────
class ClickEffect {
  constructor(x, y, hit) { this.x=x; this.y=y; this.hit=hit; this.r=8; this.life=1; }
  update() { this.r+=3.5; this.life-=.07; }
  draw() {
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.strokeStyle = this.hit ? '#00d4ff' : '#f87171';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.stroke();
    if (!this.hit) {
      const s = this.r*.5;
      ctx.beginPath();
      ctx.moveTo(this.x-s, this.y-s); ctx.lineTo(this.x+s, this.y+s);
      ctx.moveTo(this.x+s, this.y-s); ctx.lineTo(this.x-s, this.y+s);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

// ── Regular Alien class ───────────────────────────────────────────────────────
class Alien {
  constructor(level) {
    this.type  = Math.random()*ALIEN_TYPES.length|0;
    this.def   = ALIEN_TYPES[this.type];
    this.scale = .85 + Math.random()*.5;
    const hw   = (this.def.w * this.scale)/2 + 10;

    this.dir   = Math.random()<.5 ? 1 : -1;
    this.x     = this.dir===1 ? -hw : W+hw;
    this.y     = 80 + Math.random()*(H-180);

    this.vx    = (1.5 + Math.random()*1.5 + level*.2)*this.dir;
    this.vy    = 0;

    this.pattern  = ['straight','wavy','zigzag'][Math.random()*3|0];
    this.phase    = Math.random()*Math.PI*2;
    this.waveAmp  = 28 + Math.random()*40;
    this.waveFreq = .014 + Math.random()*.02;
    this.zigTimer = 0;
    this.baseY    = this.y;

    this.flash      = false;
    this.flashTimer = 0;
    this.dead       = false;
    this.escaped    = false;
    this._counted   = false;

    this.hw = (this.def.w*this.scale)/2 + 5;
    this.hh = (this.def.h*this.scale)/2 + 5;
  }

  update() {
    if (this.dead || this.escaped) return;
    this.x += this.vx;
    if (this.pattern==='wavy') {
      this.phase += this.waveFreq;
      this.y = this.baseY + Math.sin(this.phase)*this.waveAmp;
    } else if (this.pattern==='zigzag') {
      this.zigTimer++;
      if (this.zigTimer%60===0) this.vy*=-1;
      if (this.vy===0) this.vy = (Math.random()<.5?1:-1)*2;
      this.y += this.vy;
    }
    this.y = Math.max(58, Math.min(H-44, this.y));
    if (this.flashTimer>0) { this.flashTimer--; this.flash=this.flashTimer>0; }
    if (this.dir===1  && this.x > W+this.hw+20) this.escaped=true;
    if (this.dir===-1 && this.x < -this.hw-20)  this.escaped=true;
  }

  draw() {
    if (this.dead || this.escaped) return;
    ctx.save();
    if (this.dir===-1) { ctx.translate(this.x*2,0); ctx.scale(-1,1); }
    this.def.draw(ctx, this.x, this.y, this.scale, this.flash);
    ctx.restore();
  }

  isHit(mx, my) {
    return Math.abs(mx-this.x)<this.hw && Math.abs(my-this.y)<this.hh;
  }

  explode() {
    this.dead = true;
    for (let i=0; i<20+Math.random()*12|0; i++)
      G.particles.push(new Particle(this.x, this.y, this.type));
    G.popups.push(new ScorePopup(this.x, this.y-30, '+'+this.def.points));
  }
}

// ── Boss class ────────────────────────────────────────────────────────────────
const BOSS_MAX_HP = 10;

class Boss {
  constructor() {
    this.hp    = BOSS_MAX_HP;
    this.scale = 2.1;
    this.dir   = Math.random()<.5 ? 1 : -1;
    this.x     = this.dir===1 ? -120 : W+120;
    this.y     = 140 + Math.random()*(H-280);
    this.vx    = (.65 + Math.random()*.3)*this.dir;

    this.dead       = false;
    this.escaped    = false;
    this.flash      = false;
    this.flashTimer = 0;
    this.shakeX     = 0;

    this.hw = 100;
    this.hh = 110;
  }

  update() {
    if (this.dead || this.escaped) return;
    this.shakeX *= .65;
    this.x += this.vx + this.shakeX;
    if (this.flashTimer>0) { this.flashTimer--; this.flash=this.flashTimer>0; }
    if (this.dir===1  && this.x > W+130) this.escaped=true;
    if (this.dir===-1 && this.x < -130)  this.escaped=true;
  }

  draw() {
    if (this.dead || this.escaped) return;

    // HP bar above boss
    const barW = 140;
    const barX = this.x - barW/2;
    const barY = this.y - 115;
    const ratio = this.hp/BOSS_MAX_HP;
    const barCol = ratio>.6 ? '#4ade80' : ratio>.3 ? '#fbbf24' : '#f87171';

    // "BOSS" label
    ctx.fillStyle = '#f87171';
    ctx.font = 'bold 11px Orbitron, monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 10;
    ctx.fillText('★  OMEGA OVERLORD  ★', this.x, barY-6);
    ctx.shadowBlur = 0;

    // HP bar background
    ctx.fillStyle = 'rgba(0,0,0,.65)';
    roundRect(ctx, barX-2, barY-2, barW+4, 14, 4); ctx.fill();

    // HP bar fill
    if (ratio > 0) {
      ctx.fillStyle = barCol;
      ctx.shadowColor = barCol; ctx.shadowBlur = 8;
      roundRect(ctx, barX, barY, barW*ratio, 10, 3); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Bar border
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    roundRect(ctx, barX, barY, barW, 10, 3); ctx.stroke();

    // HP pips
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1;
    for (let i=1; i<BOSS_MAX_HP; i++) {
      const px = barX + (barW/BOSS_MAX_HP)*i;
      ctx.beginPath(); ctx.moveTo(px, barY); ctx.lineTo(px, barY+10); ctx.stroke();
    }

    // Boss body
    ctx.save();
    if (this.dir===-1) { ctx.translate(this.x*2,0); ctx.scale(-1,1); }
    drawBossBody(ctx, this.x, this.y, this.scale, this.flash);
    ctx.restore();
  }

  hit() {
    if (this.dead) return;
    this.hp--;
    this.flash = true;
    this.flashTimer = 9;
    this.shakeX = (Math.random()-.5)*16;

    if (this.hp > 0) {
      G.popups.push(new ScorePopup(this.x, this.y-60,
        `${this.hp} HP LEFT`, '#f87171'));
    } else {
      this.explode();
    }
  }

  explode() {
    this.dead = true;
    // Big multi-burst explosion
    for (let i=0; i<60; i++) G.particles.push(new Particle(this.x+( Math.random()-.5)*60, this.y+(Math.random()-.5)*60, 4, 1.8));
    for (let i=0; i<30; i++) G.particles.push(new Particle(this.x, this.y, 0, 1.4));
    G.score += 500;
    G.kills++;
    G.popups.push(new ScorePopup(W/2, H/2-10, '★ BOSS DEFEATED! +500 ★', '#fbbf24', true));
    showFact('OMEGA OVERLORD', true);
    updateHUD();
  }

  isHit(mx, my) {
    return Math.abs(mx-this.x)<this.hw && Math.abs(my-this.y)<this.hh;
  }
}

// ── Stars background ──────────────────────────────────────────────────────────
let stars = [];
function initStars() {
  stars = Array.from({length:260}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.6+.2,
    alpha: Math.random()*.6+.3,
    speed: Math.random()*.04+.01,
    phase: Math.random()*Math.PI*2,
    col: ['#ffffff','#c7d2fe','#a5f3fc','#ddd6fe'][Math.random()*4|0],
  }));
}

function drawStars() {
  ctx.fillStyle = '#000008';
  ctx.fillRect(0,0,W,H);
  const t = Date.now()*.001;
  stars.forEach(s => {
    ctx.globalAlpha = s.alpha*(.7+.3*Math.sin(s.phase+t*s.speed*60));
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawNebula() {
  const g1 = ctx.createRadialGradient(W*.72,H*.3,10,W*.72,H*.3,W*.42);
  g1.addColorStop(0,'rgba(99,20,120,.08)'); g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g1; ctx.fillRect(0,0,W,H);
  const g2 = ctx.createRadialGradient(W*.2,H*.72,10,W*.2,H*.72,W*.35);
  g2.addColorStop(0,'rgba(14,60,100,.09)'); g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
}

function drawGround() {
  const grad = ctx.createLinearGradient(0,H-40,0,H);
  grad.addColorStop(0,'rgba(0,30,10,.65)');
  grad.addColorStop(1,'rgba(0,50,20,.88)');
  ctx.fillStyle = grad; ctx.fillRect(0,H-40,W,40);
  ctx.strokeStyle = 'rgba(74,222,128,.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H-40); ctx.lineTo(W,H-40); ctx.stroke();
}

// ── Crosshair ─────────────────────────────────────────────────────────────────
function drawCrosshair(x, y) {
  const s = 17;
  ctx.strokeStyle = 'rgba(0,212,255,.9)'; ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00d4ff'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(x-s,y); ctx.lineTo(x-5,y);
  ctx.moveTo(x+5,y); ctx.lineTo(x+s,y);
  ctx.moveTo(x,y-s); ctx.lineTo(x,y-5);
  ctx.moveTo(x,y+5); ctx.lineTo(x,y+s);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;
}

// ── Game state ────────────────────────────────────────────────────────────────
const G = {
  score: 0, level: 1, kills: 0,
  aliens: [], boss: null,
  particles: [], popups: [], effects: [],
  spawnTimer: 0,
  running: false,
  mx: 0, my: 0,
  nextBossAt: 10,
};

function startGame() {
  G.score=0; G.level=1; G.kills=0;
  G.aliens=[]; G.boss=null;
  G.particles=[]; G.popups=[]; G.effects=[];
  G.spawnTimer=0; G.running=true;
  G.nextBossAt=10;
  factIndex=0;

  hideFact();
  updateHUD();
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('hud-restart').style.display='';
  initStars();
  requestAnimationFrame(loop);
}

function updateHUD() {
  document.getElementById('hud-level').textContent = G.level;
  document.getElementById('hud-score').textContent = G.score.toLocaleString();
  document.getElementById('hud-kills').textContent = G.kills;
}

function getSpawnRate() { return Math.max(42, 90 - G.level*8); }
function getMaxAliens() { return Math.min(10, 1 + Math.floor(G.level/2)); }

// ── Fun fact (no timer — stays until next kill) ───────────────────────────────
function showFact(alienName, isBoss=false) {
  const text = FACTS[factIndex % FACTS.length];
  factIndex++;

  const banner = document.getElementById('fact-banner');
  document.getElementById('fact-label').textContent = `🛸 ${alienName} ELIMINATED — FUN FACT`;
  document.getElementById('fact-text').textContent = text;

  banner.classList.remove('boss-fact');
  if (isBoss) banner.classList.add('boss-fact');
  banner.classList.add('show');
}

function hideFact() {
  document.getElementById('fact-banner').classList.remove('show');
}

// ── Input ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => { G.mx=e.clientX; G.my=e.clientY; });

canvas.addEventListener('click', e => {
  if (!G.running) return;
  const mx=e.clientX, my=e.clientY;
  let hit = false;

  // Boss hit check first (larger target on top visually)
  if (G.boss && !G.boss.dead && !G.boss.escaped && G.boss.isHit(mx,my)) {
    G.effects.push(new ClickEffect(mx,my,true));
    G.boss.hit();
    if (G.boss.dead) {
      // Level up on boss kill
      G.level++;
      G.nextBossAt = G.kills + 10;
      G.popups.push(new ScorePopup(W/2, H/2+40, `LEVEL ${G.level}!`, '#00d4ff', true));
      updateHUD();
      G.boss = null;
    }
    return;
  }

  // Regular alien hit check
  for (let i=G.aliens.length-1; i>=0; i--) {
    const a = G.aliens[i];
    if (!a.dead && !a.escaped && a.isHit(mx,my)) {
      G.effects.push(new ClickEffect(mx,my,true));
      a.explode();
      G.score += a.def.points;
      G.kills++;
      showFact(a.def.name);

      // Level up every 5 regular kills (not boss kills)
      if (G.kills % 5 === 0 && G.kills < G.nextBossAt) {
        G.level++;
        G.popups.push(new ScorePopup(W/2, H/2, `LEVEL ${G.level}!`, '#00d4ff', true));
      }

      // Spawn boss at kill milestone
      if (G.kills >= G.nextBossAt && !G.boss) {
        G.boss = new Boss();
        G.popups.push(new ScorePopup(W/2, H/2-40, '⚠ BOSS INCOMING! ⚠', '#f87171', true));
      }

      updateHUD();
      hit = true;
      break;
    }
  }

  if (!hit) G.effects.push(new ClickEffect(mx,my,false));
});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  canvas.dispatchEvent(new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY}));
}, {passive:false});

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  if (!G.running) return;

  drawStars();
  drawNebula();
  drawGround();

  // Spawn regular aliens
  G.spawnTimer++;
  const activeCount = G.aliens.filter(a=>!a.dead&&!a.escaped).length;
  if (G.spawnTimer >= getSpawnRate() && activeCount < getMaxAliens()) {
    G.aliens.push(new Alien(G.level));
    G.spawnTimer = 0;
  }

  // Update & draw regular aliens
  G.aliens.forEach(a => a.update());
  G.aliens.forEach(a => a.draw());

  // Silently remove escaped aliens (no lives penalty)
  G.aliens = G.aliens.filter(a => !a.dead && !a.escaped);

  // Boss
  if (G.boss) {
    G.boss.update();
    G.boss.draw();
    if (G.boss.escaped) G.boss = null;
  }

  // Particles
  G.particles.forEach(p => { p.update(); p.draw(); });
  G.particles = G.particles.filter(p => p.life>0);

  // Score popups
  G.popups.forEach(p => { p.update(); p.draw(); });
  G.popups = G.popups.filter(p => p.life>0);

  // Click effects
  G.effects.forEach(e => { e.update(); e.draw(); });
  G.effects = G.effects.filter(e => e.life>0);

  // Crosshair
  drawCrosshair(G.mx, G.my);

  requestAnimationFrame(loop);
}

// ── Background loop (idle, before game starts) ────────────────────────────────
function bgFrame() {
  if (!G.running) { drawStars(); drawNebula(); }
}
initStars();
(function bgLoop() {
  bgFrame();
  if (!G.running) requestAnimationFrame(bgLoop);
})();
</script>
